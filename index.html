<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>11504 行政與教學分機表</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f8;
      --surface: #ffffff;
      --surface-2: #f9fbfb;
      --ink: #17211f;
      --muted: #64716d;
      --line: #d9e2df;
      --admin: #0b6757;
      --teach: #365f9c;
      --active: #0b6757;
      --active-soft: #e7f3ef;
      --danger: #b42318;
      --danger-soft: #fff0ed;
      --shadow: 0 18px 44px rgba(25, 39, 36, .08);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", sans-serif;
      font-size: 15px;
    }

    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }

    .app { max-width: 1360px; margin: 0 auto; padding: 22px; }

    .masthead {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      align-items: end;
      margin-bottom: 16px;
    }

    h1 { margin: 0; font-size: 28px; line-height: 1.2; letter-spacing: 0; }
    .subtitle { color: var(--muted); margin-top: 6px; font-size: 14px; }

    .metrics { display: grid; grid-template-columns: repeat(4, minmax(104px, 1fr)); gap: 8px; }
    .metric {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      box-shadow: 0 8px 22px rgba(25, 39, 36, .04);
    }
    .metric span { display: block; color: var(--muted); font-size: 12px; }
    .metric strong { display: block; margin-top: 2px; font-size: 20px; }

    .tabs {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }
    .tab {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--ink);
      text-align: left;
      box-shadow: 0 8px 22px rgba(25, 39, 36, .04);
    }
    .tab[aria-selected="true"] { border-color: var(--active); background: var(--active-soft); }
    .tab-title { display: block; font-weight: 800; font-size: 17px; }
    .tab-sub { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
    .tab-count { font-size: 24px; font-weight: 850; }

    .workspace { display: grid; grid-template-columns: 350px 1fr; gap: 16px; align-items: start; }
    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); }
    .form-panel { padding: 16px; position: sticky; top: 16px; }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    h2 { margin: 0; font-size: 18px; line-height: 1.3; }
    .mode { color: var(--muted); font-size: 13px; }

    label { display: block; margin: 12px 0 6px; color: #2e3a36; font-size: 13px; font-weight: 700; }
    input, select, textarea {
      width: 100%;
      min-height: 40px;
      border: 1px solid #c8d5d1;
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      padding: 9px 10px;
      outline: none;
    }
    textarea { min-height: 76px; resize: vertical; }
    input:focus, select:focus, textarea:focus { border-color: var(--active); box-shadow: 0 0 0 3px rgba(11, 103, 87, .15); }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }

    .btn { min-height: 38px; border: 1px solid transparent; border-radius: 6px; padding: 8px 12px; font-weight: 800; background: #fff; color: var(--ink); white-space: nowrap; }
    .primary { background: var(--active); color: #fff; }
    .primary:hover { filter: brightness(1.08); }
    .secondary { border-color: #c9d8d4; }
    .secondary:hover { background: #edf4f2; }
    .danger { color: var(--danger); border-color: #ffd0ca; background: var(--danger-soft); }

    .table-panel { overflow: hidden; }
    .toolbar { display: grid; grid-template-columns: 1fr 180px 150px 118px; gap: 10px; padding: 14px; border-bottom: 1px solid var(--line); background: var(--surface-2); }
    .table-wrap { overflow: auto; max-height: calc(100vh - 282px); }
    table { width: 100%; min-width: 860px; border-collapse: collapse; }
    th, td { padding: 11px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
    th { position: sticky; top: 0; z-index: 1; background: #eef4f2; color: #273632; font-size: 13px; }
    tbody tr:hover { background: #f8fbfa; }
    .pill { display: inline-flex; align-items: center; max-width: 160px; min-height: 24px; padding: 3px 9px; border-radius: 999px; font-size: 12px; color: #173e37; background: #e7f3ef; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pill.teach { color: #24456f; background: #eaf0fa; }
    .phone { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-weight: 800; }
    .muted { color: var(--muted); font-size: 13px; }
    .row-actions { display: flex; justify-content: flex-end; gap: 6px; }
    .row-actions .btn { min-height: 32px; padding: 6px 9px; font-size: 13px; }
    .empty { padding: 38px 20px; text-align: center; color: var(--muted); }

    @media (max-width: 980px) {
      .app { padding: 16px; }
      .masthead { grid-template-columns: 1fr; }
      .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .workspace { grid-template-columns: 1fr; }
      .form-panel { position: static; }
      .toolbar { grid-template-columns: 1fr 1fr; }
      .table-wrap { max-height: none; }
    }
    @media (max-width: 640px) {
      h1 { font-size: 24px; }
      .tabs, .metrics, .toolbar, .two { grid-template-columns: 1fr; }
      .tab { min-height: 64px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="masthead">
      <div>
        <h1>11504 行政與教學分機表</h1>
        <div class="subtitle">依 11504.pdf 重新整理為行政單位與教學單位兩區，可查詢、新增、修改、刪除。</div>
      </div>
      <section class="metrics" aria-label="資料統計">
        <div class="metric"><span>全部資料</span><strong id="totalCount">0</strong></div>
        <div class="metric"><span>行政單位</span><strong id="adminCount">0</strong></div>
        <div class="metric"><span>教學單位</span><strong id="teachCount">0</strong></div>
        <div class="metric"><span>目前顯示</span><strong id="matchCount">0</strong></div>
      </section>
    </header>

    <nav class="tabs" aria-label="分機表分類">
      <button class="tab" type="button" data-category="行政單位" aria-selected="true">
        <span><span class="tab-title">行政單位</span><span class="tab-sub">校長室、處室、中心、場館行政</span></span>
        <span class="tab-count" id="adminTabCount">0</span>
      </button>
      <button class="tab" type="button" data-category="教學單位" aria-selected="false">
        <span><span class="tab-title">教學單位</span><span class="tab-sub">學院、學系、研究所、教師研究室</span></span>
        <span class="tab-count" id="teachTabCount">0</span>
      </button>
    </nav>

    <section class="workspace">
      <form class="panel form-panel" id="recordForm">
        <div class="panel-head">
          <h2 id="formTitle">新增分機</h2>
          <span class="mode" id="formMode">行政單位</span>
        </div>
        <input type="hidden" id="recordId">

        <label for="category">分類</label>
        <select id="category" required>
          <option value="行政單位">行政單位</option>
          <option value="教學單位">教學單位</option>
        </select>

        <label for="unit">單位 / 群組</label>
        <input id="unit" list="unitOptions" required placeholder="例如：教務處、體育學院">
        <datalist id="unitOptions"></datalist>

        <label for="name">姓名 / 職掌名稱</label>
        <input id="name" required placeholder="例如：服務專線、系主任、承辦人">

        <div class="two">
          <div>
            <label for="phone">分機 / 電話</label>
            <input id="phone" required placeholder="例如：1608 或 328-1755">
          </div>
          <div>
            <label for="source">來源</label>
            <input id="source" placeholder="例如：PDF 第1頁">
          </div>
        </div>

        <label for="note">備註</label>
        <textarea id="note" placeholder="可填樓層、承辦範圍、原 PDF 座標或其他補充"></textarea>

        <div class="actions">
          <button class="btn primary" type="submit" id="saveButton">新增</button>
          <button class="btn secondary" type="button" id="clearButton">清除</button>
          <button class="btn danger" type="button" id="resetButton">還原初始資料</button>
        </div>
      </form>

      <section class="panel table-panel">
        <div class="toolbar">
          <input id="searchInput" type="search" placeholder="查詢姓名、職掌、分機、電話、單位、備註">
          <select id="unitFilter" aria-label="依單位篩選"><option value="">全部群組</option></select>
          <select id="sortSelect" aria-label="排序">
            <option value="source">依 PDF 順序</option>
            <option value="name">依名稱</option>
            <option value="phone">依分機</option>
          </select>
          <button class="btn secondary" type="button" id="exportButton">匯出 JSON</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>分類</th>
                <th>單位 / 群組</th>
                <th>姓名 / 職掌名稱</th>
                <th>分機 / 電話</th>
                <th>來源</th>
                <th>備註</th>
                <th style="text-align:right;">操作</th>
              </tr>
            </thead>
            <tbody id="recordBody"></tbody>
          </table>
          <div class="empty" id="emptyState" hidden>沒有符合條件的資料</div>
        </div>
      </section>
    </section>
  </main>

    const $ = (id) => document.getElementById(id);
    let activeCategory = "行政單位";
    let records = loadRecords();

    function loadRecords() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (!saved) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(seedRecords));
        return [...seedRecords];
      }
      try {
        const parsed = JSON.parse(saved);
        return Array.isArray(parsed) ? parsed : [...seedRecords];
      } catch {
        return [...seedRecords];
      }
    }

    function saveRecords() { localStorage.setItem(STORAGE_KEY, JSON.stringify(records)); }
    function escapeHtml(value) {
      return String(value ?? "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#039;");
    }
    function normalize(value) { return String(value || "").trim().toLowerCase(); }

    function categoryCount(category) { return records.filter((record) => record.category === category).length; }
    function unitsForActiveCategory() {
      return [...new Set(records.filter((record) => record.category === activeCategory).map((record) => record.unit).filter(Boolean))]
        .sort((a, b) => a.localeCompare(b, "zh-Hant"));
    }

    function filteredRecords() {
      const query = normalize($("searchInput").value);
      const unit = $("unitFilter").value;
      const sortMode = $("sortSelect").value;
      const filtered = records.filter((record) => {
        if (record.category !== activeCategory) return false;
        if (unit && record.unit !== unit) return false;
        const haystack = [record.category, record.unit, record.name, record.phone, record.note, record.source, record.coordinate].join(" ").toLowerCase();
        return !query || haystack.includes(query);
      });
      return filtered.sort((a, b) => {
        if (sortMode === "name") return a.name.localeCompare(b.name, "zh-Hant");
        if (sortMode === "phone") return a.phone.localeCompare(b.phone, "zh-Hant", { numeric: true });
        return Number(a.id.replace(/\D/g, "")) - Number(b.id.replace(/\D/g, ""));
      });
    }

    function renderTabs() {
      document.querySelectorAll(".tab").forEach((tab) => {
        const selected = tab.dataset.category === activeCategory;
        tab.setAttribute("aria-selected", String(selected));
      });
      document.documentElement.style.setProperty("--active", activeCategory === "行政單位" ? "var(--admin)" : "var(--teach)");
      document.documentElement.style.setProperty("--active-soft", activeCategory === "行政單位" ? "#e7f3ef" : "#eaf0fa");
    }

    function renderFilters() {
      const currentUnit = $("unitFilter").value;
      const units = unitsForActiveCategory();
      $("unitFilter").innerHTML = '<option value="">全部群組</option>' + units.map((unit) => `<option value="${escapeHtml(unit)}">${escapeHtml(unit)}</option>`).join("");
      $("unitFilter").value = units.includes(currentUnit) ? currentUnit : "";
      $("unitOptions").innerHTML = units.map((unit) => `<option value="${escapeHtml(unit)}"></option>`).join("");
    }

    function renderTable() {
      const rows = filteredRecords();
      $("matchCount").textContent = rows.length;
      $("emptyState").hidden = rows.length > 0;
      $("recordBody").innerHTML = rows.map((record) => `
        <tr>
          <td><span class="pill ${record.category === "教學單位" ? "teach" : ""}">${escapeHtml(record.category)}</span></td>
          <td>${escapeHtml(record.unit)}</td>
          <td>${escapeHtml(record.name)}</td>
          <td class="phone">${escapeHtml(record.phone)}</td>
          <td class="muted">${escapeHtml(record.source)}</td>
          <td class="muted">${escapeHtml(record.note || record.coordinate || "")}</td>
          <td><div class="row-actions">
            <button class="btn secondary" type="button" data-action="edit" data-id="${record.id}">修改</button>
            <button class="btn danger" type="button" data-action="delete" data-id="${record.id}">刪除</button>
          </div></td>
        </tr>
      `).join("");
    }

    function renderMetrics() {
      const admin = categoryCount("行政單位");
      const teach = categoryCount("教學單位");
      $("totalCount").textContent = records.length;
      $("adminCount").textContent = admin;
      $("teachCount").textContent = teach;
      $("adminTabCount").textContent = admin;
      $("teachTabCount").textContent = teach;
    }

    function render() {
      renderTabs();
      renderMetrics();
      renderFilters();
      renderTable();
      $("formMode").textContent = $("recordId").value ? "編輯中" : activeCategory;
    }

    function resetForm() {
      $("recordForm").reset();
      $("recordId").value = "";
      $("category").value = activeCategory;
      $("unit").value = activeCategory;
      $("source").value = activeCategory === "行政單位" ? "PDF 第1頁" : "PDF 第2頁";
      $("formTitle").textContent = "新增分機";
      $("saveButton").textContent = "新增";
      $("formMode").textContent = activeCategory;
    }

    function fillForm(record) {
      activeCategory = record.category;
      $("recordId").value = record.id;
      $("category").value = record.category;
      $("unit").value = record.unit;
      $("name").value = record.name;
      $("phone").value = record.phone;
      $("source").value = record.source || "";
      $("note").value = record.note || record.coordinate || "";
      $("formTitle").textContent = "修改分機";
      $("saveButton").textContent = "儲存修改";
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    document.querySelectorAll(".tab").forEach((tab) => {
      tab.addEventListener("click", () => {
        activeCategory = tab.dataset.category;
        $("unitFilter").value = "";
        resetForm();
        render();
      });
    });

    $("recordForm").addEventListener("submit", (event) => {
      event.preventDefault();
      const id = $("recordId").value;
      const next = {
        id: id || `rec-${Date.now()}`,
        category: $("category").value,
        unit: $("unit").value.trim(),
        name: $("name").value.trim(),
        phone: $("phone").value.trim(),
        source: $("source").value.trim(),
        note: $("note").value.trim(),
        coordinate: ""
      };
      if (id) {
        records = records.map((record) => record.id === id ? next : record);
      } else {
        records = [next, ...records];
      }
      activeCategory = next.category;
      saveRecords();
      resetForm();
      render();
    });

    $("recordBody").addEventListener("click", (event) => {
      const button = event.target.closest("button[data-action]");
      if (!button) return;
      const record = records.find((item) => item.id === button.dataset.id);
      if (!record) return;
      if (button.dataset.action === "edit") fillForm(record);
      if (button.dataset.action === "delete") {
        if (!confirm(`確定刪除「${record.name}」？`)) return;
        records = records.filter((item) => item.id !== record.id);
        saveRecords();
        if ($("recordId").value === record.id) resetForm();
        render();
      }
    });

    $("clearButton").addEventListener("click", resetForm);
    $("resetButton").addEventListener("click", () => {
      if (!confirm("確定還原為 PDF 轉出的行政/教學初始資料？目前修改會被覆蓋。")) return;
      records = [...seedRecords];
      activeCategory = "行政單位";
      saveRecords();
      resetForm();
      render();
    });
    $("exportButton").addEventListener("click", () => {
      const blob = new Blob([JSON.stringify(records, null, 2)], { type: "application/json;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "11504-admin-teaching-extensions.json";
      link.click();
      URL.revokeObjectURL(url);
    });
    ["searchInput", "unitFilter", "sortSelect"].forEach((id) => $(id).addEventListener("input", render));
    $("category").addEventListener("change", () => { $("formMode").textContent = $("category").value; });

    resetForm();
    render();
  </script>
